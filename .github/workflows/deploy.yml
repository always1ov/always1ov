name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建站点
        run: npm run build

      - name: 检查产物
        run: |
          test -f dist/index.html   || { echo "::error::缺 dist/index.html"; exit 1; }
          test -f dist/404.html     || { echo "::error::缺 dist/404.html"; exit 1; }
          test -f dist/atom.xml     || { echo "::error::缺 dist/atom.xml"; exit 1; }
          echo "产物清单："
          ls -la dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: 部署到 Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 取回产物
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: 安装 wrangler
        run: npm ci --no-audit --no-fund

      - name: 推到 Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（仓库 Settings → Secrets）"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::缺少变量 CLOUDFLARE_PROJECT_NAME（仓库 Settings → Variables）"
            exit 1
          fi
          npx wrangler pages deploy ./dist \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-dirty=true
